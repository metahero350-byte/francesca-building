<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Clearing cache…</title>
<style>
  body{font-family:system-ui,sans-serif;background:#061529;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:16px;}
  .msg{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#C9A96E;}
  .sub{font-size:12px;color:rgba(255,255,255,0.4);}
  .spinner{width:32px;height:32px;border:2px solid rgba(201,169,110,0.2);border-top-color:#C9A96E;border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="spinner"></div>
<div class="msg">Clearing old cache…</div>
<div class="sub" id="status">Unregistering service workers…</div>
<script>
(async function() {
  const status = document.getElementById('status');
  try {
    // Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) { await reg.unregister(); }
      status.textContent = 'Service workers removed (' + regs.length + ')';
    }
    // Clear all caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      status.textContent = 'Caches cleared (' + keys.length + ')';
    }
    status.textContent = 'Done — redirecting…';
  } catch(e) {
    status.textContent = 'Done — redirecting…';
  }
  // Hard redirect to root — no cache
  setTimeout(() => {
    window.location.replace('/francesca-building/?v=' + Date.now());
  }, 800);
})();
</script>
</body>
</html>
